<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Reset password — Continuity</title>
  <style>
    body {
      max-width: 36rem;
      margin: 8vh auto;
      padding: 0 1.5rem;
      font: 16px/1.5 system-ui, sans-serif;
    }
    label {
      display: block;
      margin-top: 1rem;
    }
    input {
      display: block;
      box-sizing: border-box;
      width: 100%;
      padding: .7rem;
      font: inherit;
    }
    button {
      margin-top: 1.5rem;
      padding: .7rem 1.2rem;
      font: inherit;
    }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main aria-labelledby="pageTitle">
    <p>CONTINUITY / ACCOUNT SECURITY</p>
    <h1 id="pageTitle">Reset your password</h1>

    <p id="recoveryStatus" role="status" aria-live="polite">
      Verifying your recovery link…
    </p>

    <form id="resetPasswordForm" hidden>
      <label for="newPassword">New password</label>
      <input
        id="newPassword"
        type="password"
        autocomplete="new-password"
        minlength="15"
        required
      >

      <label for="confirmPassword">Confirm new password</label>
      <input
        id="confirmPassword"
        type="password"
        autocomplete="new-password"
        minlength="15"
        required
      >

      <button id="resetPasswordButton" type="submit">
        Save new password
      </button>
    </form>

    <p><a href="/">Return to sign in</a></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script>
  <script src="config/supabase-config.js"></script>
  <script src="assets/js/reset-password.js"></script>
</body>
</html>
