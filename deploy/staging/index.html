<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Continuity — Staging</title>
  <style>
    :root { color-scheme: light; }
    body { min-height: 100vh; box-sizing: border-box; margin: 0; display: grid;
      place-items: center; padding: 2rem; font: 16px/1.6 system-ui, sans-serif;
      color: #202321; background: #f7f6f3; }
    main { max-width: 38rem; width: 100%; border-top: 3px solid #375547; padding-top: 1.3rem; }
    .kicker { font-size: .75rem; letter-spacing: .12em; text-transform: uppercase;
      font-weight: 700; color: #4a6054; }
    h1 { font-size: clamp(2.5rem, 8vw, 4rem); font-weight: 550; letter-spacing: -.05em;
      line-height: 1.05; margin: .65rem 0 1.3rem; }
    p { max-width: 35rem; }
    footer { border-top: 1px solid #d7d7d1; margin-top: 2.5rem; padding-top: 1rem;
      font-size: .85rem; color: #5b645e; }
  </style>
</head>
<body>
  <main>
    <p class="kicker">Continuity / Staging</p>
    <h1>In development.</h1>
    <p>This environment is reserved for testing Continuity before release.
      The application and live account services are intentionally not connected here.</p>
    <footer>Staging holding page — no sign-in, data access, or background processing.</footer>
  </main>
</body>
</html>
