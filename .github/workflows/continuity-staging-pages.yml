name: Deploy Continuity Staging

# Stage only. Never publish on a main-branch push or PR.
on:
  push:
    branches:
      - staging
  pull_request:
    branches:
      - main
      - staging
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: continuity-staging-pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validate synthetic staging release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch or PR merge
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install authenticated memory test dependencies
        run: python3 -m pip install -r backend/requirements-memory-ci.txt
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in frontend/assets/js/night-observatory-*.js; do
            node --check "$file"
          done
      - name: Run Night Observatory regression tests
        run: node --test frontend/tests/night-observatory-*.test.cjs
      - name: Run B1/B2 database security tests
        run: python3 -m unittest discover -s backend/tests -p 'test_b*_*.py' -v
      - name: Run B3 read-only memory tests
        run: python3 -m unittest discover -s backend/tests -p 'test_memory_*.py' -v
      - name: Run production release safeguard tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_production_site.py' -v
      - name: Build isolated Pages bundle from reviewed assets
        run: python3 scripts/build_staging_site.py --output dist/staging
      - name: Upload Pages artifact for staging pushes only
        if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/staging

  deploy:
    name: Publish staging to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Deploy verified Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
